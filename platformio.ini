; ЛР 5.2 — PID-регулирование (DHT22, ШИМ + MOSFET, LCD I2C), Arduino Uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
; -lprintf_flt: поддержка %f в printf на AVR
build_flags =
    -Wall
    -Wl,-u,vfprintf
    -lprintf_flt
    -lm

; Сборка с программной тепловой моделью вместо DHT22 (для демонстрации в эмуляторе)
[env:uno_sim]
extends = env:uno
build_flags =
    ${env:uno.build_flags}
    -DSIMULATE_PLANT

; Модульные тесты логики на ПК: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++11
lib_ignore =
    Button
    Led
    Buzzer
    AlarmIndicator
    TempSensor
    LcdDisplay
    SerialStdio
    PwmOutput
